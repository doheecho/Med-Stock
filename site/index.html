<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메-Stock · 개인 포트폴리오 대시보드</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
</head>
<body>
  <header class="topbar">
    <h1>메-Stock <span class="sub">개인 포트폴리오 대시보드</span></h1>
    <div class="meta">
      <span id="asOf">데이터 로딩 중…</span>
      <button id="refreshBtn" type="button" title="시세 데이터 다시 불러오기">↻ 현재가 갱신</button>
      <button id="advisorBtn" type="button" title="AI Advisor 코멘트 다시 불러오기">↻ AI Advisor</button>
    </div>
  </header>

  <!-- 포트폴리오 요약 -->
  <section id="summary" class="summary">
    <div class="cards">
      <div class="card"><div class="label">총 매수금액</div><div class="value" id="sumCost">—</div></div>
      <div class="card"><div class="label">총 평가금액 <em>(실시간)</em></div><div class="value" id="sumValue">—</div></div>
      <div class="card"><div class="label">총 평가손익 <em>(실시간)</em></div><div class="value" id="sumPl">—</div></div>
      <div class="card"><div class="label">전일대비 <em>(실시간)</em></div><div class="value" id="sumDay">—</div></div>
    </div>

    <div id="advisor" class="advisor" hidden></div>

    <div class="summary-charts">
      <div class="chart-box">
        <button id="viewToggleBtn" class="pie-toggle" type="button">회사별</button>
        <canvas id="weightChart"></canvas>
      </div>
      <div class="table-wrap">
        <table id="posTable">
          <thead>
            <tr>
              <th data-key="name">종목</th><th data-key="quantity">수량</th>
              <th data-key="buy_price">매수단가</th><th data-key="cur">현재가</th>
              <th data-key="day">전일대비</th>
              <th data-key="cost">매수금액</th><th data-key="value">평가액</th>
              <th data-key="pl">평가손익</th><th data-key="plPct">수익률</th><th data-key="weight">비중</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 종목 탭 -->
  <nav id="tabs" class="tabs"></nav>

  <main id="detail" class="detail">
    <!-- 종목별 패널이 JS로 렌더됨 -->
  </main>

  <footer id="provenance" class="provenance" hidden></footer>

  <div id="toast" class="toast" hidden></div>

  <!-- Chart.js v4 + 날짜 어댑터 + 캔들 플러그인 -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <!-- dashboard.js 수정 시 ?v= 를 바꿔 캐시 무효화 (GitHub Pages 기본 캐시 10분) -->
  <script src="./dashboard.js?v=20260830a"></script>
</body>
</html>
