# 보유 종목 목록 (단방향: 이 파일만 내가 GitHub 에서 수정 → data/*.json 자동 재생성)
#
# ticker : KRX 는 6자리 종목코드(문자열, ETF 는 숫자+영문 혼합 가능), 미국은 야후 심볼
# name   : 화면 표시명
# market : KRX | US
# lots   : 계좌별 매수 내역. buy_price 는 "매수 평단가"(1주당), quantity 는 보유 수량.
#          같은 종목을 여러 계좌로 보유하면 lots 에 계좌별로 나눠 적는다.
#          - 종목별 조회: 계좌 무관, (Σ 평단가×수량) / (Σ 수량) 로 통합 평단가 표시
#          - 회사별 조회: 계좌 버블로 계좌별 매수금액/수량/평가액 표시
# buy_date: (선택) 최초 매수일 YYYY-MM-DD

