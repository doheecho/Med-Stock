name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    # 봇 토큰으로 data/ 를 커밋하면 push 트리거가 안 걸리므로(GitHub 정책),
    # 데이터 생성 워크플로 완료 이벤트로도 재배포를 건다.
    workflows: ["Update dashboard data", "Rebuild holdings", "Refresh AI Advisor"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site (site/ + data/)
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          test -f _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
