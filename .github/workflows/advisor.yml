name: Refresh AI Advisor

# Gemini 로 AI Advisor 코멘트 + 종목별 보조지표 신호 서술(data/signals/*.json) 갱신.
# 커밋돼 있는 data/*.json(snapshot·indices·prices·news)으로 먼저 빠르게 서술을 만든 뒤,
# 마지막에 "Update dashboard data" 워크플로를 디스패치해 시세·지표까지 새로 수집한다.
#   → 대시보드 "↻ AI Advisor" 버튼 한 번 = 서술 갱신 + 전체 데이터 갱신
# GEMINI_API_KEY 가 없어도 규칙 엔진 신호는 data/signals/*.json 에 그대로 기록된다.

on:
  schedule:
    - cron: "10 22 * * *"   # KST 07:10
    - cron: "10 5 * * 1-5"  # KST 14:10 평일
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # update.yml 디스패치용

concurrency:
  group: advisor
  cancel-in-progress: false

jobs:
  advisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "requests>=2.31" "pyyaml>=6"

      - name: Generate advisor comment
        working-directory: collectors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python advisor_collector.py

      - name: Commit advisor.json + signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advisor.json data/signals
          if git diff --cached --quiet; then
            echo "변경 없음 (키 미설정이거나 동일 결과)"
          else
            git commit -m "chore: refresh AI advisor ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Trigger full dashboard data update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml --ref main \
            && echo "'Update dashboard data' 디스패치 완료" \
            || echo "[warn] update.yml 디스패치 실패 (권한/이름 확인)"
